; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
lib_extra_dirs = D:\DhanushkaC\Documents\Arduino\libraries
lib_ldf_mode = deep
monitor_speed = 115200
#monitor_port = COM04
monitor_filters = esp32_exception_decoder
board_build.partitions = default.csv
; LittleFS, not SPIFFS: the PrimeHive connectivity core (cfgindex/wifi_creds/OTA)
; is LittleFS-only. Switching reformats flash — re-upload the data/ image after
; the first flash of this build.
board_build.filesystem = littlefs
; Injects -D GIT_REV="<hash>@<branch>" so the exact build is identifiable on the
; wire (hw_caps.build), independent of the human fw_ver string.
extra_scripts = pre:scripts/git_rev.py
build_flags =
	; 3072, not 1024: the RainmakerOTA chunk is 1536 bytes and the PubSubClient
	; RX buffer must exceed it or every chunk is silently dropped.
	-D MQTT_MAX_PACKET_SIZE=3072
	-D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192
	; WLAN gates the whole wifi_mqtt transport — without it nothing compiles in.
	-D WLAN
	-D HAS_PIXEL
	-D FW_VER_BASE=\"v0.1-sewing-wifi\"
	; Human semantic version (bumped per release). The precise build id is GIT_REV
	; (hw_caps.build), injected by scripts/git_rev.py. v2.2 = Modbus input source.
	-D FW_VER=\"v2.2\"
upload_flags =
lib_deps = 
	ottowinter/ESPAsyncWebServer-esphome @ 3.0.0
	#mathieucarbou/ESPAsyncWebServer @ 3.3.2
	; NTPClient removed — unused; clockConfig.cpp uses configTime() directly.
	adafruit/Adafruit NeoPixel@^1.11.0
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.21.3
	me-no-dev/AsyncTCP @ 1.1.1
	adafruit/MAX6675 library@^1.1.2
	; RS485 Modbus RTU to the machine PLC (modbus_input.cpp, HAS_MODBUS boards).
	4-20ma/ModbusMaster@^2.0.1
	#ayushsharma82/ElegantOTA@^3.1.6
